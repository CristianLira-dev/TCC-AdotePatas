name: Deploy via FTP para InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validar e publicar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AdotePatas

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, mysqli, pdo_mysql
          tools: composer:v2

      - name: Instalar dependências de produção
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Validar dependências
        run: |
          composer validate --strict --no-check-publish
          composer audit --locked --no-interaction

      - name: Verificar sintaxe PHP
        run: |
          find . -type f -name "*.php" \
            -not -path "./vendor/*" \
            -print0 | xargs -0 -n1 php -l

      - name: Rodar teste de segurança
        run: php tests/security_test.php

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./AdotePatas/
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/node_modules/**
            **/tests/**
            **/scripts/**
            **/database/**
            **/uploads/**
            **/*.sql
            **/*.log
            **/composer.json
            **/composer.lock
            **/README.md
            **/phpunit.xml
            **/phpunit.xml.dist
