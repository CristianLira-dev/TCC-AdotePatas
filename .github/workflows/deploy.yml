name: Deploy via FTP para InfinityFree

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Sincronizar arquivos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Instalar dependências PHP
        working-directory: AdotePatas
        run: |
          rm -rf vendor
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Validar configuração do Composer
        working-directory: AdotePatas
        run: composer validate --strict --no-check-publish

      - name: Auditar dependências
        working-directory: AdotePatas
        run: composer audit --locked --no-interaction

      - name: Verificar sintaxe PHP
        working-directory: AdotePatas
        run: find . -path ./vendor -prune -o -path ./fpdf -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Executar testes
        working-directory: AdotePatas
        run: php tests/security_test.php

      - name: Sincronizar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: AdotePatas/
          server-dir: htdocs/
          exclude: |
            **/.env
            **/.env.*
            **/composer.json
            **/composer.lock
            **/scripts/**
            **/tests/**
            **/database/**
            **/uploads/**
            **/*.sql
            **/*.log
